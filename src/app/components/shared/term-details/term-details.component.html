<div
    class="transition ease-in-out duration-500 w-full bg-slate-50 dark:bg-slate-800 h-[calc(100vh-60px)] p-2 rounded-lg lg:rounded-none shadow-xl flex flex-col gap-2">
    <div class="flex items-center justify-between w-full gap-2">
        <span *ngIf="can_go_back" (click)="closeDetails()" class="font-thin material-symbols-outlined text-slate-950 dark:text-indigo-900"
            role="button">arrow_back</span>
        <span class="flex-grow font-black capitalize text-[20px] text-slate-950 dark:text-indigo-800">{{ term.term
            }}</span>
        <span (click)="closeDetails()" class="font-thin material-symbols-outlined table lg:hidden text-slate-950 dark:text-indigo-900"
            role="button">close</span>
    </div>
    <div>
        <app-select *ngIf="term.translations"></app-select>
    </div>
    <div class="text-slate-950 dark:text-slate-200">
        {{term.definition}}
    </div>
</div>
