<div class="flex items-start justify-start fixed top-0 left-0 bg-indigo-100 dark:bg-indigo-950 h-screen w-screen">
    <div class="h-screen w-[{{menu_width}}px] bg-indigo-800 transition-all duration-300 ease-in-out">
        <!-- Add a menu svg -->
        <svg xmlns="URL_ADDRESS.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
            stroke="currentColor" class="w-6 h-6 text-white ml-4 mt-4" (click)="toggleMenu()">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" />
        </svg>
        <!-- Add a menu svg -->
        <div class="flex flex-col items-start justify-start overflow-auto">
            <a href="/"
                class="flex items-center justify-start w-full py-2 px-4 text-white hover:bg-indigo-700 transition-all duration-300 ease-in-out">
                {{expanded_menu ? 'Home': 'H'}}</a>
        </div>
    </div>
    <div class="h-screen w-[{{page_width}}px] block">
        <div class="h-[50px] w-full border-b-2 border-solid border-red-400 flex items-center justify-between">
            <app-dark-mode></app-dark-mode>
        </div>
        <div class="h-[calc(100vh-50px)] w-[{{page_width}}px] overflow-auto">
            <router-outlet></router-outlet>
        </div>
    </div>
</div>
