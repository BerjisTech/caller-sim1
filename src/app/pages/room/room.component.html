<div class="relative w-screen h-screen overflow-hidden flex" (timeupdate)="calculateVideoSizes()">
    <div class="flex flex-col items-start justify-start flex-grow h-screen">
        <div [ngStyle]="getGridStyles()" class="grid w-full overflow-y-auto">
            <div *ngFor="let remote of remote_streams" class="bg-slate-950 flex items-center justify-center">
                <video id="remote_video" [appSrcObject]="remote.stream" autoplay playsinline
                    class="bg-slate-900 w-auto max-w-full self-stretch h-auto max-h-full rounded-md border-none"
                    autoplay muted="muted"></video>
            </div>
            <div class="bg-slate-950 flex items-center justify-center">
                <video class="rounded-md border-none bg-black w-full h-full max-w-full max-h-full" #local_video_element
                    id="local_video" [srcObject]="local_stream" autoplay muted playsinline></video>
            </div>
        </div>
        <div class="h-[100px] w-full flex items-center justify-center gap-3">
            <app-dark-mode></app-dark-mode>
            <button (click)="toggleAudio()">Mute</button>
            <button (click)="toggleVideo()">Camera</button>
            <button (click)="show_sidechat = !show_sidechat">Information</button>
        </div>
    </div>
    <div *ngIf="show_sidechat" class="h-screen w-[500px] bg-white dark:bg-slate-950">
        <div class="flex w-full gap-2 items-center justify-center p-2">
            <div
                class="flex-grow rounded-xl text-center px-3 py-2 bg-slate-300 dark:bg-slate-800 text-slate-950 dark:text-slate-200">
                Chat
            </div>
            <div
                class="flex-grow rounded-xl text-center px-3 py-2 bg-slate-300 dark:bg-slate-800 text-slate-950 dark:text-slate-200">
                Details
            </div>
            <div
                class="flex-grow rounded-xl text-center px-3 py-2 bg-slate-300 dark:bg-slate-800 text-slate-950 dark:text-slate-200">
                Paticipants
            </div>
        </div>
        <div>
            Room: {{room_name}}
        </div>
        <div class="flex flex-col gap-2">
            Users
            <p *ngFor="let user of connected_users" class="w-full hover:bg-orange-50">
                {{user|json}}
            </p>
        </div>
    </div>
</div>
