<div class="streaming-container">
    <h2>Available Broadcasters</h2>
    <ul>
        <li *ngFor="let broadcaster of broadcasters">
            <span>ID: {{ broadcaster.id }}</span>
            <button (click)="joinStream(broadcaster.id)">Join</button>
        </li>
    </ul>

    <h2>Streaming</h2>
    <div class="video-container">
        <video #localVideo autoplay muted></video>
        <video #remoteVideo autoplay></video>
    </div>

    <div class="controls">
        <button (click)="startBroadcast()">Start Broadcast</button>
    </div>
</div>
